[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "egeyuma-bhashanthara"
version = "0.1.0"
description = "Local-first translation and verification pipeline for Sinhala benchmark datasets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Dishan Rajapaksha" }
]
dependencies = [
  "httpx>=0.27,<1",
  "huggingface_hub>=0.23,<1",
  "pydantic>=2.7,<3",
  "rich>=13,<15",
  "typer>=0.12,<1"
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8,<9",
  "ruff>=0.8,<1"
]

[project.scripts]
bhashanthara = "bhashanthara.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bhashanthara"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "data/raw",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["bhashanthara"]

[tool.pytest.ini_options]
testpaths = ["tests"]
